name: Development Policy

on:
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate human-owned PR branch
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: python validators/check_branch_policy.py --branch "$PR_HEAD_BRANCH"
      - name: Test branch policy and Git hooks
        run: python -m unittest discover -s tests -p test_branch_policy.py -v

  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate bundles, safety patterns, and toolbar specification
        run: |
          python validators/check_bundle_structure.py
          python validators/check_safety_rules.py
          python validators/validate_toolbar_spec.py
      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v
      - name: Run extension regression tests when available
        shell: bash
        run: |
          while IFS= read -r test_dir; do
            python -m unittest discover -s "$test_dir" -v
          done < <(find extensions -mindepth 2 -maxdepth 2 -type d -name tests | sort)
      - name: Install MCP test dependencies when available
        if: hashFiles('servers/revit-mcp/mcp-server/tests/test_*.py') != ''
        run: python -m pip install -r servers/revit-mcp/mcp-server/requirements.txt
      - name: Run MCP regression tests when available
        if: hashFiles('servers/revit-mcp/mcp-server/tests/test_*.py') != ''
        run: python -m pytest servers/revit-mcp/mcp-server/tests -q
